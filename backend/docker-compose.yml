services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - warda_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - warda_redis:/data

  api:
    build: .
    environment:
      APP_NAME: Warda
      APP_ENV: development
      SECRET_KEY: warda-dev-change-me-please
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: warda
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "*"
      TRUSTED_HOSTS: localhost,127.0.0.1,api
      OTP_DEV_RETURN_CODE: "true"
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  warda_mongo:
  warda_redis:
